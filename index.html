<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>Bloodborne: The Last Hunt</title><link rel="stylesheet" href="style.css"></head><body><main class="game-wrap"><canvas id="game" width="1280" height="720" tabindex="0" aria-label="Изометрический мир Bloodborne. WASD движение, Пробел перекат, ЛКМ удар, E взаимодействие."></canvas>
<div id="hud" hidden><div class="vitals"><div class="meter health"><div id="rally-bar"></div><div id="hp-bar"></div></div><div class="meter stamina"><div id="stamina-bar"></div></div><div class="vital-meta"><span id="hp-text">100 / 100</span><span id="weapon">Пила-тесак</span></div><div class="supplies"><span><kbd>Q</kbd> <b id="heals">3</b> <small>ЛЕЧЕНИЕ</small></span><span><kbd>ПКМ</kbd> <b id="ammo">6</b> <small>ПУЛИ</small></span></div></div><div class="wealth"><div><small>ОТГОЛОСКИ КРОВИ</small><b id="echoes">0</b></div><div><small>ОЗАРЕНИЕ</small><b id="insight">0</b></div></div><div class="hud-actions"><button id="inventory-button">Tab · Инвентарь</button><button id="pause-button">Esc · Пауза</button><span id="save-state" title="Сохранение">Сохранено</span></div><div class="location" id="location-banner"><span id="location">Центральный Ярнам</span><small id="location-subtitle">Город, который не просыпается</small></div><div id="interact-hint" class="interact" hidden><kbd>E</kbd><span id="interact-text"></span></div><div class="boss-hud" id="boss-hud" hidden><div><span id="boss-name">Отец Гаскойн</span><small id="boss-phase">I</small></div><div class="meter boss"><div id="boss-bar"></div></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div><div id="overlay" class="overlay"><section id="menu" class="menu-panel"><p class="eyebrow">THE LAST HUNT</p><h2>Возвращение в Ярнам</h2><p class="intro">Загружаются мир и персонажи…</p></section></div><div class="system-actions"><button id="sound" aria-pressed="false">Звук: выкл.</button><button id="fullscreen">На весь экран</button></div>
<div id="mobile" hidden><div class="dpad"><button data-move="up" aria-label="Вверх">↑</button><button data-move="left" aria-label="Влево">←</button><button data-move="down" aria-label="Вниз">↓</button><button data-move="right" aria-label="Вправо">→</button></div><div class="touch-actions"><button data-action="attack">Удар</button><button data-action="shoot">Выстрел</button><button data-action="dodge">Перекат</button><button data-action="interact">Осмотреть</button><button data-action="heal">Лечение</button><button data-action="dash">Рывок</button><button data-action="transform">Оружие</button></div></div></main><script type="module" src="js/main.mjs"></script></body></html>
